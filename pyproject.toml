[project]
name = "bitcoin-5-minute"
version = "0.1.0"
description = "Polymarket up/down market data collector and trading bot"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28.0",
    "py-clob-client>=0.1.0",
    "py-builder-relayer-client>=0.0.1",
    "websocket-client>=1.9.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
