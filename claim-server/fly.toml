# fly.toml app configuration file generated for polymarket-claim on 2026-02-28T14:30:11-06:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'polymarket-claim'
primary_region = 'ewr'

[build]
  dockerfile = 'Dockerfile'

[processes]
  worker = 'uv run python main.py'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
